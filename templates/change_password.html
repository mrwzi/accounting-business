{% extends "layout.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}

<div class="card form-card" style="max-width:640px;margin:0 auto;">
  <div class="form-header">
    <div class="h1">Change Password</div>
    <div class="muted">Signed in as {{ username }}</div>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field field-full">
        <label class="muted">Current password</label>
        <input name="current_password" type="password" autocomplete="current-password" required>
      </div>

      <div class="field field-full">
        <label class="muted">New password</label>
        <input name="new_password" type="password" autocomplete="new-password" minlength="10" required>
      </div>

      <div class="field field-full">
        <label class="muted">Confirm new password</label>
        <input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
      </div>
    </div>

    <div class="muted" style="margin-top:8px;">
      The new password is saved to .env immediately for your account.
    </div>

    <div class="form-footer">
      <a class="btn" href="{{ url_for('dashboard') }}">Cancel</a>
      <button class="btn primary" type="submit">Update Password</button>
    </div>
  </form>
</div>

{% endblock %}
