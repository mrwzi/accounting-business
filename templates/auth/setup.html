<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set up · Accounting</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main class="container"><section class="card" style="max-width:560px;margin:60px auto;"><h1 class="h1">Set up your workspace</h1><p class="muted">Create the first owner account. Your workspace starts completely empty.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post" style="margin-top:16px;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><div class="col-12"><label class="muted">Owner username</label><input name="username" autocomplete="username" required autofocus></div><div class="col-12"><label class="muted">Default currency</label><select name="reporting_currency"><option value="USD" selected>USD</option></select><div class="field-help">New entries use USD by default.</div></div><div class="col-12"><label class="muted">Password</label><input name="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="col-12"><label class="muted">Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div></div><button class="btn primary" style="margin-top:16px;" type="submit">Create workspace</button></form></section></main></body></html>
