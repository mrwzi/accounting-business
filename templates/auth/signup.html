<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up · Accounting</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main class="container"><section class="card" style="max-width:520px;margin:60px auto;"><h1 class="h1">Create an account</h1><p class="muted">Accounts share this workspace. Only enable public sign-ups for people you trust.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}{% if not disabled %}<form method="post" style="margin-top:16px;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><div class="col-12"><label class="muted">Username</label><input name="username" autocomplete="username" required autofocus></div><div class="col-12"><label class="muted">Password</label><input name="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="col-12"><label class="muted">Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div></div><button class="btn primary" style="margin-top:16px;" type="submit">Create account</button></form>{% endif %}<p class="muted" style="margin-top:18px;"><a href="{{ url_for('login') }}">Back to sign in</a></p></section></main></body></html>
