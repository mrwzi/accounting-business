<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Accounting</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main class="container"><section class="card" style="max-width:520px;margin:60px auto;"><h1 class="h1">Welcome back</h1><p class="muted">Sign in to your accounting workspace.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post" style="margin-top:16px;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><div class="col-12"><label class="muted">Username</label><input name="username" autocomplete="username" required autofocus></div><div class="col-12"><label class="muted">Password</label><input name="password" type="password" autocomplete="current-password" required></div></div><button class="btn primary" style="margin-top:16px;" type="submit">Sign in</button></form><p class="muted" style="margin-top:18px;">Need an account? <a href="{{ url_for('signup') }}">Sign up</a></p></section></main></body></html>
